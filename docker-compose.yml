services:
  postgres:
    image: postgres:16
    container_name: edunova-postgres
    environment:
      POSTGRES_DB: edunova
      POSTGRES_USER: ${POSTGRES_USER:-hasan}
      # Üretimde: .env dosyasından güçlü bir şifre verin (docker compose otomatik okur).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hasan123}
    ports:
      # Yalnızca localhost'a bağlanır — veritabanı ağdan doğrudan erişilebilir olmamalı.
      - "127.0.0.1:5432:5432"
    volumes:
      - edunova_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hasan} -d edunova"]
      interval: 5s
      timeout: 5s
      retries: 20

  # UYARI: Adminer bir veritabanı yönetim arayüzüdür ve kimlik doğrulaması
  # yalnızca DB şifresine dayanır. YALNIZCA geliştirme profilinde çalışır:
  #   docker compose --profile dev up
  # Üretim ortamında asla açmayın.
  adminer:
    image: adminer:latest
    container_name: edunova-adminer
    profiles: ["dev"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  edunova_pgdata:
