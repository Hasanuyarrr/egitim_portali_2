<!DOCTYPE html>
<html lang="tr">
<head>
  <script>(function(){try{var t=localStorage.getItem('edunova_theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeCScop — Sınavlar</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="student-shell.css">
  <style>
    .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:45; }
    @media (max-width:980px){ .sidebar-overlay.visible{display:block;} }
    .exam-card { border:1px solid var(--border); background:var(--bg-card); border-radius:var(--radius); padding:16px 18px; }
    .exam-meta { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; font-size:.78rem; color:var(--text-3); }
    .exam-meta span { background:var(--bg); border:1px solid var(--border); padding:2px 8px; border-radius:99px; }
    .last-exam-banner { border:1px solid var(--border); background:var(--bg); border-radius:var(--radius); padding:14px 16px; }
    .last-exam-banner-head { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); margin-bottom:8px; }
    .last-exam-banner-row { display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; }
    .last-exam-banner-title { font-weight:800; color:var(--text); flex:1; min-width:160px; }
    .last-exam-banner-score { font-size:1.35rem; font-weight:800; color:var(--text); }
    .last-exam-banner-badge { font-size:.78rem; font-weight:700; padding:4px 10px; border-radius:99px; }
    .last-exam-pass { background:rgba(34,197,94,.15); color:#16a34a; border:1px solid rgba(34,197,94,.35); }
    .last-exam-fail { background:rgba(239,68,68,.12); color:#dc2626; border:1px solid rgba(239,68,68,.35); }
    .last-exam-banner-date { font-size:.78rem; color:var(--text-3); margin-top:8px; }
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <main class="admin-main">
    <header class="topbar">
      <div class="topbar-left">
        <button type="button" class="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
        <div>
          <div class="topbar-title" data-i18n="student.topbar.brand">Öğrenci Paneli</div>
          <div class="topbar-page-hint" id="studentPageHint"></div>
          <div class="topbar-sub" id="topbarSub"></div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="notif-wrap" id="notifWrap">
          <button type="button" class="btn btn-ghost btn-sm notif-btn" id="notifBtn" onclick="toggleNotifPanel()" data-i18n-title="student.page.announcements" title="Duyurular">🔔
            <span class="notif-badge" id="notifBadge" aria-hidden="true"></span>
          </button>
          <div class="notif-panel" id="notifPanel">
            <div style="padding:10px 12px;border-bottom:1px solid var(--border);font-size:.76rem;font-weight:700;color:var(--text-2);display:flex;justify-content:space-between;align-items:center;">
              <span id="notifPanelTitle">Yeni Duyurular</span>
              <a id="notifSeeAll" href="student-announcements.html" style="font-size:.72rem;color:var(--blue);text-decoration:none;">Tümünü gör</a>
            </div>
            <div id="notifList" style="padding:0;"></div>
          </div>
        </div>
        <div class="topbar-avatar">
          <div class="avatar avatar-blue" style="width:28px;height:28px;font-size:0.7rem;" id="avatarInitials">—</div>
          <span class="topbar-avatar-name" id="avatarName">Öğrenci</span>
        </div>
      </div>
    </header>

    <div class="page">
      <div class="card">
        <div class="card-header">
          <h3 data-i18n="student.nav.exams">Sınav</h3>
        </div>
        <div class="card-body" style="padding-bottom:12px;">
          <div id="lastExamResultWrap" class="last-exam-banner" style="display:none;margin-bottom:14px;"></div>
          <div id="examList">
            <div style="text-align:center;padding:16px;color:var(--text-3);font-size:0.84rem;" data-i18n="common.loading">Yükleniyor…</div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="theme-i18n.js"></script>
<script src="student-shared.js"></script>
<script>
  initStudentShell({ activePage: "exams", pageLabelKey: "student.nav.exams" });
  if (typeof t === "function") document.title = "SeCScop — " + t("student.nav.exams");

  // Ortak, tırnak/backtick kaçışlı sürüm (student-shared.js).
  var esc = window.escapeHtml;

  function fmtWindow(ex) {
    var s = ex.starts_at ? new Date(ex.starts_at) : null;
    var e = ex.ends_at ? new Date(ex.ends_at) : null;
    var loc = typeof getLang === "function" && getLang() === "en" ? "en-US" : "tr-TR";
    function fmt(d) {
      if (!d) return "—";
      return d.toLocaleString(loc, { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    }
    if (!s && !e) return typeof t === "function" ? t("common.general") : "Genel";
    return fmt(s) + " → " + fmt(e);
  }

  function fmtSubmittedAt(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    var loc = typeof getLang === "function" && getLang() === "en" ? "en-US" : "tr-TR";
    return d.toLocaleString(loc, { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
  }

  function renderLastResultBanner(last) {
    if (!last) return "";
    var title = esc(last.exam_title || "");
    var score = Math.round(Number(last.score || 0));
    var passLabel =
      typeof t === "function"
        ? last.passed
          ? t("student.exams.passedBadge")
          : t("student.exams.failedBadge")
        : last.passed
          ? "Geçti"
          : "Kaldı";
    var head = typeof t === "function" ? t("student.exams.lastResultTitle") : "Son sınav sonucunuz";
    var badgeClass = last.passed ? "last-exam-pass" : "last-exam-fail";
    return (
      '<div class="last-exam-banner-inner">' +
      '<div class="last-exam-banner-head">' +
      esc(head) +
      "</div>" +
      '<div class="last-exam-banner-row">' +
      '<span class="last-exam-banner-title">' +
      title +
      "</span>" +
      '<span class="last-exam-banner-score">' +
      score +
      "%</span>" +
      '<span class="last-exam-banner-badge ' +
      badgeClass +
      '">' +
      esc(passLabel) +
      "</span>" +
      "</div>" +
      '<div class="last-exam-banner-date">' +
      esc(fmtSubmittedAt(last.submitted_at)) +
      "</div>" +
      "</div>"
    );
  }

  async function reloadPage() {
    var wrap = document.getElementById("examList");
    var banner = document.getElementById("lastExamResultWrap");
    var list;
    var lastRes;
    try {
      var pair = await Promise.all([apiFetch("/exams/available"), apiFetch("/exams/last-result")]);
      list = pair[0];
      lastRes = pair[1];
    } catch (e) {
      wrap.innerHTML =
        '<div class="empty-state"><span class="empty-icon">⚠️</span><p>Yüklenemedi.</p></div>';
      if (banner) {
        banner.style.display = "none";
        banner.innerHTML = "";
      }
      return;
    }
    if (banner) {
      if (lastRes && !lastRes.error && lastRes.last) {
        banner.style.display = "block";
        banner.innerHTML = renderLastResultBanner(lastRes.last);
      } else {
        banner.style.display = "none";
        banner.innerHTML = "";
      }
    }
    if (list && list.error) {
      wrap.innerHTML =
        '<div class="empty-state"><span class="empty-icon">⚠️</span><p>' +
        esc(list.error) +
        "</p></div>";
      return;
    }
    var arr = Array.isArray(list) ? list : [];
    if (!arr.length) {
      wrap.innerHTML =
        '<div class="empty-state"><span class="empty-icon">🧪</span><p>Şu an açık sınav yok. Yönetici sınavı yayınlamalı ve tarih aralığını kontrol etmelisiniz.</p></div>';
      return;
    }
    wrap.innerHTML = arr
      .map(function (ex) {
        var pr = ex.proctor || {};
        var maxA = Math.max(1, Number(ex.max_attempts != null ? ex.max_attempts : 3));
        var used = Math.max(0, Number(ex.attempts_used != null ? ex.attempts_used : 0));
        var canStart = used < maxA;
        var attLbl =
          typeof t === "function"
            ? t("student.exams.attemptsShort", { used: String(used), max: String(maxA) })
            : "Deneme: " + used + "/" + maxA;
        var btnLabel = typeof t === "function" ? t("student.exams.noAttemptsLeft") : "Deneme hakkınız doldu.";
        var lr = ex.last_result;
        var lastLine = "";
        if (lr && lr.submitted_at != null) {
          var st =
            typeof t === "function"
              ? lr.passed
                ? t("student.exams.passedBadge")
                : t("student.exams.failedBadge")
              : lr.passed
                ? "Geçti"
                : "Kaldı";
          lastLine =
            typeof t === "function"
              ? t("student.exams.cardLastResult", { score: String(Math.round(Number(lr.score || 0))), status: st })
              : "Son deneme: " + Math.round(Number(lr.score || 0)) + "% — " + st;
        }
        return (
          '<div class="exam-card" style="margin-bottom:10px;">' +
          '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;">' +
          '<div style="min-width:220px;">' +
          '<div style="font-weight:800;color:var(--text);">' +
          esc(ex.title) +
          "</div>" +
          '<div style="font-size:.86rem;color:var(--text-2);margin-top:4px;line-height:1.45;">' +
          esc(ex.description || "") +
          "</div>" +
          '<div class="exam-meta">' +
          "<span>⏱ " +
          Number(ex.duration_minutes || 0) +
          " dk</span>" +
          "<span>🎯 " +
          Number(ex.pass_score || 0) +
          "</span>" +
          "<span>" +
          esc(attLbl) +
          "</span>" +
          "<span>" +
          (pr.require_camera ? "📷 Kamera" : "📷 Opsiyonel") +
          "</span>" +
          "<span>" +
          (pr.require_fullscreen ? "⛶ Fullscreen" : "⛶ Opsiyonel") +
          "</span>" +
          "</div>" +
          '<div style="font-size:.78rem;color:var(--text-3);margin-top:8px;">' +
          esc(fmtWindow(ex)) +
          "</div>" +
          (lastLine
            ? '<div style="font-size:.82rem;margin-top:10px;color:var(--text-2);font-weight:600;">' +
              esc(lastLine) +
              "</div>"
            : "") +
          "</div>" +
          '<div style="display:flex;gap:8px;align-items:center;flex-direction:column;">' +
          (canStart
            ? '<a class="btn btn-primary btn-sm" href="student-exam.html?id=' +
              encodeURIComponent(String(ex.id)) +
              '" style="text-decoration:none;">Sınava gir</a>'
            : '<span class="btn btn-ghost btn-sm" style="opacity:.65;cursor:not-allowed;" title="' +
              esc(btnLabel) +
              '">' +
              esc(btnLabel) +
              "</span>") +
          "</div>" +
          "</div>" +
          "</div>"
        );
      })
      .join("");
  }

  reloadPage();
</script>
</body>
</html>
